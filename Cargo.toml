[workspace]
resolver = "2"
members = ["crates/rules-core", "crates/carddb"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rand = "0.8"
rand_chacha = "0.3"
thiserror = "1"
