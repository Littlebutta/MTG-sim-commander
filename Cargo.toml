[workspace]
resolver = "2"
exclude = ["app/src-tauri"]
members = ["crates/rules-core", "crates/carddb", "crates/client-api", "crates/engine-wasm"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rand = { version = "0.8", default-features = false, features = ["alloc"] }
rand_chacha = { version = "0.3", default-features = false }
thiserror = "1"
